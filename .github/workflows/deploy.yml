name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            config.js.example
            .htaccess.example

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch Passenger restart file
        run: |
          mkdir -p backend/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backend/tmp/restart.txt

      - name: FTP deploy backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./backend/
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            .env.example
